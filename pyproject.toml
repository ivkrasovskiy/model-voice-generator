[project]
name = "model-voice-generator"
version = "0.1.0"
description = "Benedict Cumberbatch voice cloning — zero-shot TTS, dataset pipeline, fine-tuning"
requires-python = ">=3.10,<3.12"
dependencies = [
    # Zero-shot TTS
    "f5-tts",
    # Transcription
    "openai-whisper",
    # PyTorch — Apple Silicon (MPS) compatible via standard PyPI wheels
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    # Audio processing
    "librosa",
    "soundfile",
    "pydub",
    "ffmpeg-python",
    # Analysis
    "scikit-learn",
    "matplotlib",
    "pandas",
    "numpy",
    "tqdm",
    # HuggingFace ecosystem (for model downloads, fine-tuning)
    "huggingface_hub[cli]",
    "accelerate",
    "datasets",
    "transformers",
    "safetensors",
    # Optional: silero-vad via torch.hub doesn't need this package, but having it pinned is cleaner
    "silero-vad",
    "python-dotenv>=1.2.2",
    # Fine-tune observability + eval
    "tensorboard",
    "resemblyzer",
    # Richer posthoc eval metrics
    "jiwer",          # Word Error Rate (Whisper transcript vs prompt)
    "speechbrain",    # ECAPA-TDNN speaker similarity (SOTA voxceleb embedding)
    "onnxruntime",    # DNSMOS audio-quality MOS prediction
    "praat-parselmouth>=0.4.7",
    "dtw-python>=1.5.3",
    "whisperx>=3.3.1",
    "sounddevice>=0.5.5",
    "ipywidgets>=8.1.8",
    "nltk>=3.9.4",
]

[tool.uv]
python-preference = "only-managed"
package = false   # this is a research repo, not a distributable package

[dependency-groups]
dev = [
    "nbconvert>=7.17.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Sensible defaults: catch real bugs (F, B), enforce import hygiene (I), nudge
# toward modern syntax (UP, SIM). Skip stylistic noise (E501) — research scripts
# routinely have long prompts/comments.
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# _dotenv_init.init_env_then_reexec() must run before regular imports
"scripts/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
